name: Rust CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo clippy --locked --features web --all-targets -- -D warnings
      - run: cargo test --locked --features web
      - run: cargo build --locked --features web
      - run: python3 tests/web_smoke.py target/debug/wiretuna

  live-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: rustup show
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo test --locked --all-features
