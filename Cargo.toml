[package]
name = "wiretuna"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A lightweight network packet analyzer"

[target.'cfg(target_os = "linux")'.dependencies]
ctrlc = { version = "3.5.0", optional = true }
nix = { version = "0.32", optional = true, default-features = false, features = ["net"] }
pcap = { version = "2.5.0", optional = true }

[features]
live-capture = ["dep:pcap", "dep:ctrlc", "dep:nix"]
